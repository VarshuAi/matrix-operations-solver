<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Matrix Operations Solver — Glassmorphism Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-bg"></div>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-row">
                <span class="logo-emoji">🧮</span>
                <div class="title-col">
                    <h1>Matrix Matrix Operations Solver</h1>
                    <p class="tagline">Sandbox doing 2x2 and 3x3 matrix multiplications.</p>
                </div>
            </div>
            <div class="badge">science</div>
        </header>

        <main class="workspace-card">
            
            <div style="display:flex; gap:12px; justify-content:center; align-items:center;">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:4px; width:60px;">
                    <input type="number" value="1" style="padding:4px; text-align:center;">
                    <input type="number" value="2" style="padding:4px; text-align:center;">
                    <input type="number" value="3" style="padding:4px; text-align:center;">
                    <input type="number" value="4" style="padding:4px; text-align:center;">
                </div>
                <span>x</span>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:4px; width:60px;">
                    <input type="number" value="5" style="padding:4px; text-align:center;">
                    <input type="number" value="6" style="padding:4px; text-align:center;">
                    <input type="number" value="7" style="padding:4px; text-align:center;">
                    <input type="number" value="8" style="padding:4px; text-align:center;">
                </div>
            </div>
        
        </main>
        
        <footer class="app-footer">
            <p>Created as a premium portfolio piece by <a href="https://github.com/VARSHAN69" target="_blank">@VARSHAN69</a></p>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
